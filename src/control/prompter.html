<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Cutaway Prompter</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #view { position: absolute; inset: 0; overflow: hidden; }
  #flip { position: absolute; inset: 0; }
  #text { position: absolute; left: 8%; right: 8%; top: 0; white-space: pre-wrap; line-height: 1.3; font-weight: 600; will-change: transform; }
  #shade { position: absolute; left: 0; right: 0; top: 0; pointer-events: none; }
  #arrow { position: absolute; width: 0; height: 0; border-top: 0.45em solid transparent; border-bottom: 0.45em solid transparent; border-left: 0.6em solid #f5a524; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; padding: 10px; background: rgba(20,22,28,.85); transition: opacity .4s; }
  #bar.hide { opacity: 0; pointer-events: none; }
  #bar button { font: inherit; font-size: 18px; min-width: 52px; padding: 10px 14px; border-radius: 10px; border: 0; background: #2a2f3a; color: #fff; }
  #bar span { align-self: center; color: #aab; min-width: 90px; text-align: center; }
  #pin { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: #10131a; }
  #pin input { font-size: 28px; width: 160px; text-align: center; padding: 8px; border-radius: 8px; border: 0; }
  #msg { position: fixed; top: 12px; left: 0; right: 0; text-align: center; color: #f5a524; font-size: 14px; }
</style>
</head>
<body>
<div id="view"><div id="flip"><div id="text"></div><div id="shade"></div><div id="arrow"></div></div></div>
<div id="bar">
  <button id="top" title="Back to the top">⏮</button>
  <button id="back" title="Back a paragraph">◀</button>
  <button id="play" title="Roll / pause">▶</button>
  <button id="fwd" title="Forward a paragraph">▶▶</button>
  <button id="slower">−</button><span id="wpm"></span><button id="faster">＋</button>
</div>
<div id="pin"><form><input id="pinbox" inputmode="numeric" placeholder="PIN" autocomplete="off"></form></div>
<div id="msg"></div>
<script>
"use strict";
// The script comes from /api/prompter; where it is, how fast, and whether
// it's rolling come with the show's state over the WebSocket. Between
// messages it rolls on by itself so it stays smooth.
const $ = (id) => document.getElementById(id);
let pin = new URLSearchParams(location.search).get("pin") || (document.cookie.match(/cutaway_pin=([^;]+)/) || [])[1] || localStorage.getItem("cutaway_pin") || "";
let st = null, stAt = 0, version = -1, textNode = null, ws = null;
const q = () => (pin ? "?pin=" + encodeURIComponent(pin) : "");

function send(cmd) {
  if (ws && ws.readyState === 1) ws.send(cmd);
  else fetch("/api/action?do=" + encodeURIComponent(cmd) + (pin ? "&pin=" + encodeURIComponent(pin) : ""));
}

async function loadScript() {
  const r = await fetch("/api/prompter" + q());
  if (r.status === 401) return askPin();
  const j = await r.json();
  version = j.version;
  const el = $("text");
  el.textContent = j.text || "";
  textNode = el.firstChild;
}

function askPin() {
  $("pin").style.display = "flex";
  $("pinbox").focus();
}
document.querySelector("#pin form").onsubmit = (e) => {
  e.preventDefault();
  pin = $("pinbox").value.trim();
  localStorage.setItem("cutaway_pin", pin);
  $("pin").style.display = "none";
  connect();
};

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/api/ws" + q());
  ws.onmessage = (ev) => {
    const m = JSON.parse(ev.data);
    if (m.type !== "state") return;
    const p = m.state.prompter;
    if (!p) { $("msg").textContent = "No script (Settings → Teleprompter)"; st = null; return; }
    $("msg").textContent = "";
    st = p; stAt = performance.now();
    if (p.version !== version) loadScript();
    style();
  };
  ws.onclose = () => setTimeout(connect, 1500);
  ws.onerror = () => { fetch("/api/state" + q()).then((r) => { if (r.status === 401) askPin(); }); };
}

function style() {
  const h = innerHeight;
  const size = Math.max(14, h * (st.text_size || 0.075));
  const t = $("text");
  t.style.fontSize = size + "px";
  t.style.color = st.text_color;
  document.body.style.background = st.background;
  $("flip").style.transform = st.mirror ? "scaleX(-1)" : "none";
  $("play").textContent = st.playing ? "⏸" : "▶";
  $("wpm").textContent = Math.round(st.words_per_minute) + " wpm";
  const reading = h * 0.3;
  const shade = $("shade");
  shade.style.height = Math.max(0, reading - size * 0.9) + "px";
  shade.style.background = st.background;
  shade.style.opacity = 0.55;
  const a = $("arrow");
  a.style.fontSize = size + "px";
  a.style.left = "2%";
  a.style.top = (reading + size * 0.1) + "px";
}

// Where character `i` is, from the top of the text.
function yOf(i) {
  if (!textNode) return 0;
  const n = textNode.length;
  const r = document.createRange();
  const k = Math.max(0, Math.min(n - 1, Math.floor(i)));
  r.setStart(textNode, k);
  r.setEnd(textNode, Math.min(n, k + 1));
  const rect = r.getClientRects()[0] || r.getBoundingClientRect();
  const top = $("text").getBoundingClientRect().top;
  return rect.top - top;
}

function frame() {
  if (st && textNode) {
    let pos = st.position;
    if (st.playing) pos += st.speed * (performance.now() - stAt) / 1000;
    const y = yOf(pos) + (yOf(pos + 1) - yOf(pos)) * (pos - Math.floor(pos));
    $("text").style.transform = "translateY(" + (innerHeight * 0.3 - y) + "px)";
  }
  requestAnimationFrame(frame);
}

let hideBar = null;
function showBar() {
  $("bar").classList.remove("hide");
  clearTimeout(hideBar);
  hideBar = setTimeout(() => $("bar").classList.add("hide"), 4000);
}
$("view").onclick = () => { send("prompter:toggle"); showBar(); };
for (const [id, cmd] of [["play", "toggle"], ["top", "top"], ["back", "back"], ["fwd", "forward"], ["slower", "slower"], ["faster", "faster"]]) {
  $(id).onclick = (e) => { e.stopPropagation(); send("prompter:" + cmd); showBar(); };
}
addEventListener("keydown", (e) => {
  const k = { " ": "toggle", ArrowUp: "slower", ArrowDown: "faster", ArrowLeft: "back", ArrowRight: "forward", Home: "top" }[e.key];
  if (k) { e.preventDefault(); send("prompter:" + k); }
});
addEventListener("resize", () => st && style());
showBar();
loadScript().then(connect);
requestAnimationFrame(frame);
</script>
</body>
</html>
