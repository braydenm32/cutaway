# Publishes a release on the repository's Releases page. Push a version tag
# (git tag v0.6.0 && git push origin v0.6.0), or run it by hand with a tag:
# it builds and tests Cutaway on macOS and Windows (the same workflows as
# every push, test recordings included) and publishes both zips and the
# Stream Deck plugin, with the notes in docs/releases/<tag>.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.6.0 (made from this branch if it doesn't exist yet)"
        required: true

# Read-only by default: only the publish step (which builds nothing) can
# write to the repository, so a build step can't change a release.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag matches the version in Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but Cargo.toml says $version"
            exit 1
          fi

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml
    # Signed with the Developer ID and notarized when the MAC_* secrets are
    # set (docs/DEVELOPING.md); unsigned with a warning until then.
    with:
      sign: true
    secrets: inherit

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          cp streamdeck/Cutaway.streamDeckPlugin dist/
          # Fingerprints of the downloads: Cutaway's own updater checks them.
          # The Stream Deck plugin is in the list too, so the signature covers it.
          (cd dist && sha256sum *.zip *.streamDeckPlugin > SHA256SUMS.txt && cat SHA256SUMS.txt)
          ls -la dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Already there (a re-run): replace the files, but only while it's
            # still a draft. A published release's files are the ones that
            # were signed; new builds would no longer match the signature.
            if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::$TAG is already published; make a new version instead of replacing its files."
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            notes=(--generate-notes)
            if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); fi
            # Once the app checks update signatures (a public key in
            # src/net/signing.rs), the release waits as a draft: the
            # fingerprints are signed off line (cutaway --sign-update) and
            # SHA256SUMS.txt.sig added before it's published.
            draft=()
            if grep -Eq 'PUBLIC_KEY: &str = "[0-9a-f]{64}"' src/net/signing.rs; then
              draft=(--draft)
              echo "::notice::Draft release: sign SHA256SUMS.txt (cutaway --sign-update SHA256SUMS.txt --key <file>), add SHA256SUMS.txt.sig, then publish."
            fi
            gh release create "$TAG" dist/* --title "Cutaway $version" --target "$GITHUB_SHA" --latest "${draft[@]}" "${notes[@]}"
          fi
