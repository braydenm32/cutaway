# Publishes a release on the repository's Releases page. Push a version tag
# (git tag v0.6.0 && git push origin v0.6.0), or run it by hand with a tag:
# it builds and tests Cutaway on macOS and Windows (the same workflows as
# every push, test recordings included) and publishes both zips and the
# Stream Deck plugin, with the notes in docs/releases/<tag>.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.6.0 (made from this branch if it doesn't exist yet)"
        required: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version in Cargo.toml
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::The tag is $TAG but Cargo.toml says $version"
            exit 1
          fi

  macos:
    needs: check
    uses: ./.github/workflows/macos.yml

  windows:
    needs: check
    uses: ./.github/workflows/windows.yml

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          cp streamdeck/Cutaway.streamDeckPlugin dist/
          ls -la dist
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Already there (a re-run): replace the files.
            gh release upload "$TAG" dist/* --clobber
          else
            notes=(--generate-notes)
            if [ -f "docs/releases/$TAG.md" ]; then notes=(--notes-file "docs/releases/$TAG.md"); fi
            gh release create "$TAG" dist/* --title "Cutaway $version" --target "$GITHUB_SHA" --latest "${notes[@]}"
          fi
