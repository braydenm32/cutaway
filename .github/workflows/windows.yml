# Builds and tests Cutaway on Windows (GitHub's Windows machines), and
# keeps the Windows zip as a download on each run.
name: Windows

on:
  push:
    branches: ["**"]
  workflow_dispatch:
  # The release workflow builds with this too.
  workflow_call:

# Builds only read the repository.
permissions:
  contents: read

# A newer push replaces a run still going on the same branch.
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Only GitHub's own actions (actions/*) are used: Rust comes from
      # rustup, already on the runners, so no one else's action runs here.
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            windows/vcam/target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'windows/vcam/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Media Foundation (an optional feature on Windows Server)
        shell: pwsh
        run: |
          $f = Get-WindowsFeature -Name Server-Media-Foundation -ErrorAction SilentlyContinue
          if ($f -and -not $f.Installed) { Install-WindowsFeature Server-Media-Foundation | Out-Host }

      - name: Unit tests (including Media Foundation encode and decode)
        run: |
          mkdir -p ci-logs
          # One test at a time, output shown as it happens: if a test crashes
          # the process, the report can say which one.
          cargo test --locked --release -- --test-threads=1 --nocapture 2>&1 | tee ci-logs/1-tests.log

      - name: Unit tests again, all at once (catches threads getting in each other's way)
        run: cargo test --locked --release 2>&1 | tee ci-logs/1b-tests-together.log

      - name: Virtual camera tests
        run: cargo test --locked --release --manifest-path windows/vcam/Cargo.toml 2>&1 | tee ci-logs/2-vcam-tests.log

      - name: Build and package
        run: powershell.exe -ExecutionPolicy Bypass -File windows/build.ps1 -NoAsio 2>&1 | tee ci-logs/3-build.log

      - name: The zip unpacks and starts the way Cutaway's updater does it
        shell: pwsh
        run: |
          $zip = (Get-ChildItem dist\*.zip | Select-Object -First 1).FullName
          $to = Join-Path $env:RUNNER_TEMP "unpack"
          if (Test-Path $to) { Remove-Item $to -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $to | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -x -f $zip -C $to
          $exe = Join-Path $to "Cutaway\Cutaway.exe"
          $out = Join-Path $env:RUNNER_TEMP "version.txt"
          Start-Process -FilePath $exe -ArgumentList "--version" -Wait -NoNewWindow -RedirectStandardOutput $out
          $v = Get-Content $out -Raw
          "tar: $(Get-ChildItem $to -Recurse | Measure-Object | Select-Object -ExpandProperty Count) files; --version: $v" | Tee-Object -FilePath ci-logs\5-unpack.log
          if ($v -notmatch [regex]::Escape((Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value)) { exit 1 }

      - name: A test recording (test pictures and tone, Windows encoders)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\Cutaway\Cutaway.exe -ArgumentList "--demo","2","--headless","--seconds","8" -Wait -PassThru -NoNewWindow
          $out = @("exit code $($p.ExitCode)")
          $out += Get-Content "$env:LOCALAPPDATA\Cutaway\Logs\Cutaway.log" -Tail 60 -ErrorAction SilentlyContinue
          $out += Get-ChildItem -Recurse "$env:USERPROFILE\Videos\Cutaway" -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName) $($_.Length)" }
          $out | Tee-Object -FilePath ci-logs\4-recording.log
          python .github/check-take.py ci-logs\4-recording.log "$env:USERPROFILE\Videos\Cutaway" $p.ExitCode

      - uses: actions/upload-artifact@v6
        with:
          name: Cutaway-windows-x64
          path: dist/*.zip

      - name: Report what failed
        if: failure()
        run: python .github/ci-report.py ci-logs
